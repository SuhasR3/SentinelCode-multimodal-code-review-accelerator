<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Code Input & Display</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <div class="container">
        <h1>Code Input & Display</h1>

        <!-- Input Section -->
        <div class="box-section">
            <label>Paste Code</label>
            <textarea id="inputBox" placeholder="Paste your code here..."></textarea>
        </div>

        <!-- Output Section -->
        <div class="box-section">
            <label>Code Analysis</label>
            <textarea id="outputBox" placeholder="Results will appear here..." readonly></textarea>
        </div>
    </div>

</body>
</html>
